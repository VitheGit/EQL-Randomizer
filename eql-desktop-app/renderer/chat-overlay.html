<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent; overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    /* A small inset so the window's own resize edges stay grabbable —
       with a frameless transparent window the hit area is right at the
       border, and a panel flush to the edge makes it hard to catch. */
    padding: 4px;
    box-sizing: border-box;
  }

  #panel {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: rgba(28, 22, 16, 0.82);
    border: 1px solid rgba(168, 130, 61, 0.7);
    border-radius: 6px;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* The only draggable region — everything interactive below must opt
     out with -webkit-app-region: no-drag or it can't be clicked. */
  #bar {
    -webkit-app-region: drag;
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px;
    background: rgba(140, 59, 42, 0.85);
    color: #F6ECD3;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    flex-shrink: 0;
    cursor: move;
  }
  #bar .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #close {
    -webkit-app-region: no-drag;
    background: transparent; border: none; color: #F6ECD3;
    font-size: 15px; line-height: 1; cursor: pointer; padding: 0 2px;
    flex-shrink: 0;
  }
  #close:hover { color: #FFD9CF; }

  #online .on { color: #8FBF7F; }
  #online .off { color: #C08080; }
  #online {
    flex-shrink: 0;
    padding: 4px 8px;
    font-size: 10px;
    color: #C9B98F;
    border-bottom: 1px solid rgba(168,130,61,0.35);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #messages {
    flex: 1; overflow-y: auto; padding: 6px 8px;
    font-size: 12px; line-height: 1.45;
  }
  .line { margin-bottom: 2px; word-wrap: break-word; }
  .time { color: #8A7A5C; font-size: 9px; margin-right: 5px; }
  .from { font-weight: 700; margin-right: 4px; }
  .text { color: #EDE3CC; }
  .system .text { color: #9FB07E; font-style: italic; }
  /* Brighter gold on the dark panel than the main window's yellow. */
  .achievement .text { color: #E8C468; font-style: normal; font-weight: 600; }
  .empty { color: #8A7A5C; font-style: italic; font-size: 11px; }

  #inputRow {
    -webkit-app-region: no-drag;
    display: flex; gap: 5px; padding: 6px; flex-shrink: 0;
    border-top: 1px solid rgba(168,130,61,0.35);
    position: relative;
  }
  #emojiBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(168,130,61,0.5);
    border-radius: 3px; cursor: pointer; flex-shrink: 0;
    font-size: 14px; line-height: 1; padding: 4px 6px;
  }
  #emojiBtn:hover { background: rgba(255,255,255,0.22); }
  #emojiPanel {
    display: none;
    position: absolute; bottom: calc(100% + 4px); right: 6px; z-index: 30;
    width: 244px; max-height: 160px; overflow-y: auto;
    flex-wrap: wrap; gap: 1px; padding: 6px;
    background: rgba(24, 19, 14, 0.97);
    border: 1px solid rgba(168,130,61,0.7); border-radius: 5px;
  }
  #emojiPanel.open { display: flex; }
  #emojiPanel button {
    width: 26px; height: 26px; font-size: 15px; line-height: 1;
    background: transparent; border: none; border-radius: 3px; cursor: pointer;
  }
  #emojiPanel button:hover { background: rgba(255,255,255,0.15); }
  #msg {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(168,130,61,0.5);
    border-radius: 3px;
    color: #F6ECD3; font-size: 12px; padding: 5px 7px;
    outline: none;
  }
  #msg::placeholder { color: #8A7A5C; }
  #msg:focus { border-color: rgba(168,130,61,0.95); }
  #send {
    background: rgba(140, 59, 42, 0.9);
    border: 1px solid rgba(168,130,61,0.5);
    border-radius: 3px;
    color: #F6ECD3; font-size: 11px; font-weight: 700;
    padding: 5px 10px; cursor: pointer; flex-shrink: 0;
  }
  #send:hover { background: rgba(160, 70, 50, 0.95); }

  #messages::-webkit-scrollbar { width: 7px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(168,130,61,0.45); border-radius: 4px; }
</style>
</head>
<body>
  <div id="panel">
    <div id="bar">
      <span class="title">Group Chat</span>
      <button id="close" title="Close overlay">&times;</button>
    </div>
    <div id="online">Online: —</div>
    <div id="messages"><p class="empty">No messages yet.</p></div>
    <div id="inputRow">
      <div id="emojiPanel"></div>
      <input type="text" id="msg" maxlength="500" placeholder="Message your group…" />
      <button id="emojiBtn" title="Emoji">&#128512;</button>
      <button id="send">Send</button>
    </div>
  </div>
  <script src="emoji.js"></script>
  <script src="chat-overlay.js"></script>
</body>
</html>
