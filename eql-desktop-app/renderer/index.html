<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EQ Legends Randomizer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Segoe UI', 'Crimson Pro', serif;
    background: radial-gradient(1200px 600px at 50% -10%, #F3E7C9 0%, #ECDFC0 55%, #DCC99C 100%);
    color: #2A2016;
    overflow-y: auto;
  }

  #app { max-width: 1150px; margin: 0 auto; padding: 28px 24px 60px; }
  .header, .user-bar, .links-bar, .legal-footer { max-width: 760px; margin-left: auto; margin-right: auto; }

  :root {
    --parchment: #ECDFC0;
    --parchment-dark: #DCC99C;
    --ink: #2A2016;
    --ink-soft: #5A4B38;
    --bronze: #A8823D;
    --bronze-bright: #D4A94E;
    --ember: #8C3B2A;
    --moss: #4B5A3A;
  }

  .header { text-align: center; margin-bottom: 6px; }
  .header img { max-width: 220px; height: auto; filter: drop-shadow(0 4px 10px rgba(42,32,22,0.3)); }
  .header .subtitle {
    font-weight: 900; font-size: 30px;
    color: var(--ember); margin: -10px 0 0;
  }
  .update-banner {
    color: #E63946;
    font-weight: 700;
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
    margin: -8px 0 0;
  }

  .user-bar {
    display: flex; justify-content: center; align-items: baseline; gap: 10px;
    margin-bottom: 18px; font-size: 13px; color: var(--ink-soft);
  }
  .user-bar strong { color: var(--ink); }
  .user-bar button {
    font-size: 12px; color: var(--ember); background: none; border: none;
    text-decoration: underline; cursor: pointer; padding: 0;
  }

  .card {
    background: linear-gradient(180deg, #F6ECD3 0%, #ECDCB4 100%);
    border: 1px solid var(--bronze); border-radius: 6px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 12px 26px -16px rgba(42,32,22,0.4);
    padding: 22px 24px; margin-bottom: 16px;
  }
  #character-card { position: relative; }
  .character-card-badges {
    position: absolute; top: 12px; right: 14px;
    display: flex; align-items: center; gap: 6px;
  }

  .card h3 {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--moss);
    margin: 0 0 12px; text-align: center;
  }

  .result-label { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-soft); text-align: center; margin: 0 0 14px; }

  /* Doubled-size, bold "page identity" headings — Your Character,
     Leaderboard, Adventure Log, Instructions — kept visually distinct
     from ordinary in-page card headings like Group/Server/Admin. */
  .page-title.result-label,
  h3.page-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .race-line { font-weight: 900; font-size: 30px; color: var(--ember); text-align: center; margin: 4px 0 2px; min-height: 1.2em; }
  .race-tag { font-size: 11px; color: var(--ink-soft); text-align: center; text-transform: uppercase; margin: 0 0 18px; }

  .trio { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .class-slot {
    background: var(--ink); color: var(--parchment); font-weight: 700; font-size: 13px;
    padding: 10px 16px; border-radius: 4px; min-width: 100px; text-align: center;
  }
  .class-slot.is-primary { background: var(--ember); box-shadow: 0 0 0 2px var(--bronze-bright); }
  .class-slot .n { display: block; font-size: 8px; letter-spacing: 0.2em; color: var(--bronze-bright); margin-bottom: 3px; }
  .class-slot.is-primary .n { color: #F3D9A8; }

  .note { text-align: center; font-size: 12px; color: var(--ink-soft); font-style: italic; margin: 16px 0 0; }
  .note.warn { color: var(--ember); font-style: normal; }

  .toggles-row { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 0 0 6px; }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); cursor: pointer; }
  .toggle input { accent-color: var(--ember); width: 14px; height: 14px; cursor: pointer; }
  .hint { text-align: center; font-size: 11px; color: var(--ink-soft); font-style: italic; margin: 4px 0 0; }
  .hint-left { text-align: left; }
  /* Pulls a hint up tight under the field it describes — .field has a
     12px bottom margin, which otherwise leaves the hint floating in a
     gap, visually detached from the input it belongs to. */
  .hint-under-field { margin: -8px 0 12px; }
  .hint.active { color: var(--ember); font-style: normal; }

  .actions { display: flex; justify-content: center; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
  .btn {
    font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 11px 22px; border-radius: 4px; border: 1px solid var(--ink); cursor: pointer;
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-primary { background: var(--ember); color: var(--parchment); border-color: var(--ember); }
  .btn-ghost { background: transparent; color: var(--ink-soft); border-color: var(--ink-soft); }
  .btn-blue { background: #2563EB; color: #fff; border-color: #1D4ED8; }
  .btn-died { background: var(--ink); color: #E8B4A8; border-color: var(--ink); }
  .btn-ding { background: var(--bronze-bright); color: var(--ink); border-color: var(--bronze); }
  .btn-full { width: 100%; }

  input[type="text"], input[type="password"], select {
    width: 100%; font-size: 14px; padding: 9px 12px; border-radius: 4px;
    border: 1px solid var(--bronze); background: rgba(255,255,255,0.6); color: var(--ink);
  }
  input[type="text"]:disabled, input[type="password"]:disabled, select:disabled {
    background: rgba(42,32,22,0.08); color: var(--ink-soft); border-color: rgba(122,90,52,0.4);
    cursor: not-allowed;
  }
  label.field-label { display: block; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--moss); margin-bottom: 5px; }
  .field { margin-bottom: 12px; }
  .error-text { color: var(--ember); font-size: 12px; font-style: italic; margin: 4px 0 10px; }

  .auth-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .auth-tab { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--parchment-dark); background: transparent; color: var(--ink-soft); cursor: pointer; }
  .auth-tab.active { background: var(--ember); color: var(--parchment); border-color: var(--ember); }

  .path-list { list-style: none; margin: 0; padding: 0; }
  .path-list li { display: flex; justify-content: space-between; padding: 7px 2px; border-bottom: 1px solid var(--parchment-dark); font-size: 13px; }
  .path-list li:last-child { border-bottom: none; }
  .path-range { font-weight: 700; font-size: 11px; color: var(--bronze); white-space: nowrap; }

  .lb-row {
    display: grid;
    grid-template-columns: 36px 1fr;
    column-gap: 8px;
    align-items: start;
    padding: 8px 2px;
    border-bottom: 1px solid var(--parchment-dark);
    font-size: 13px;
  }
  .lb-row:last-child { border-bottom: none; }
  .log-row {
    display: grid;
    grid-template-columns: 108px 1fr;
    gap: 4px 10px;
    align-items: baseline;
    padding: 8px 2px;
    border-bottom: 1px solid var(--parchment-dark);
    font-size: 13px;
  }
  .log-row:last-child { border-bottom: none; }
  .lb-rank { font-weight: 700; font-size: 11px; color: var(--ink-soft); white-space: nowrap; padding-top: 2px; }
  .lb-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .lb-line1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .lb-name { font-weight: 600; }
  .lb-level { font-size: 11px; color: var(--ember); white-space: nowrap; margin-left: auto; }
  .lb-build { font-size: 11px; color: var(--ink-soft); }
  .log-stamp { font-size: 10px; color: var(--bronze); white-space: nowrap; }
  .log-text strong { font-size: 12px; }
  .empty-text { font-size: 12px; color: var(--ink-soft); font-style: italic; }

  .lb-filters {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px;
    padding: 10px 12px; margin-bottom: 12px;
    background: rgba(122,90,52,0.08); border-radius: 6px;
  }
  .lb-filters .field { min-width: 120px; flex: 1 1 120px; }
  .lb-filters .lb-filter-status-field { min-width: 90px; flex: 0 1 90px; }
  .lb-filter-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; padding-bottom: 9px; }

  .chat-body { display: flex; gap: 10px; margin-bottom: 10px; align-items: stretch; }
  .chat-body .chat-scroll { flex: 1; min-width: 0; margin-bottom: 0; }
  .chat-online {
    width: 150px; flex-shrink: 0; overflow-y: auto; max-height: 220px;
    background: rgba(255,255,255,0.35); border: 1px solid var(--bronze);
    border-radius: 4px; padding: 8px 10px;
  }
  .chat-online-title {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--moss); font-weight: 700; margin-bottom: 6px;
  }
  .chat-online-user { font-size: 12px; line-height: 1.6; color: var(--ink); display: flex; align-items: center; }
  .chat-online-user.chat-mine { color: var(--ember); font-weight: 700; }
  .chat-online-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #4C8A4C;
    display: inline-block; margin-right: 6px; flex-shrink: 0;
  }
  .chat-online-dot.offline { background: #A83232; }
  .chat-online-user.is-offline { color: var(--ink-soft); opacity: 0.75; }
  .chat-offline-title { margin-top: 8px; }
  .chat-online-empty { font-size: 11px; color: var(--ink-soft); font-style: italic; margin: 0; }
  @media (max-width: 900px) {
    .chat-body { flex-direction: column; }
    .chat-online { width: auto; max-height: 110px; }
  }

  .chat-scroll {
    max-height: 220px; overflow-y: auto; margin-bottom: 10px;
    background: rgba(255,255,255,0.35); border: 1px solid var(--bronze);
    border-radius: 4px; padding: 8px 10px;
  }
  .chat-line { font-size: 13px; line-height: 1.5; margin-bottom: 2px; word-wrap: break-word; }
  .chat-time { color: var(--ink-soft); font-size: 10px; margin-right: 6px; opacity: 0.75; }
  .chat-from { font-weight: 700; margin-right: 5px; color: var(--ink); }
  .chat-from.chat-mine { color: var(--ember); }
  .chat-text { color: var(--ink); }
  .chat-system .chat-text { color: var(--moss); font-style: italic; }
  /* Achievements get their own tone so they stand out from the
     death/ding/level-up system lines. */
  .chat-achievement .chat-text { color: #9A7B12; font-weight: 600; }
  .chat-input-row { display: flex; gap: 8px; position: relative; }
  .chat-emoji-btn {
    flex-shrink: 0; width: 34px; padding: 0; font-size: 16px; line-height: 1;
    cursor: pointer; background: rgba(255,255,255,0.6);
    border: 1px solid var(--bronze); border-radius: 4px;
  }
  .chat-emoji-btn:hover { background: rgba(255,255,255,0.9); }
  .chat-emoji-panel {
    position: absolute; bottom: calc(100% + 6px); right: 0; z-index: 40;
    width: 300px; max-height: 210px; overflow-y: auto;
    display: flex; flex-wrap: wrap; gap: 2px;
    padding: 8px; border-radius: 6px;
    background: #F6ECD3; border: 1px solid var(--bronze);
    box-shadow: 0 8px 20px -6px rgba(42,32,22,0.45);
  }
  .chat-emoji-panel button {
    width: 30px; height: 30px; font-size: 17px; line-height: 1;
    background: transparent; border: none; border-radius: 4px; cursor: pointer;
  }
  .chat-emoji-panel button:hover { background: rgba(42,32,22,0.12); }
  /* Opacity, name-color swatches and the overlay toggle share one row. */
  .chat-controls-row { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chat-opacity-label { font-size: 11px; color: var(--ink-soft); font-style: italic; white-space: nowrap; flex-shrink: 0; }
  .chat-controls-row input[type="range"] { flex: 1; min-width: 70px; }
  .chat-opacity-value { font-size: 11px; color: var(--ink-soft); width: 34px; text-align: right; flex-shrink: 0; }
  .chat-swatches { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .chat-controls-row .btn.active { background: var(--ember); color: var(--parchment); border-color: var(--ember); }
  /* Keeps Send and Overlay the same footprint so the rows line up. */
  .chat-input-row .btn, .chat-action-btn { min-width: 88px; flex-shrink: 0; }
  .chat-swatch {
    width: 18px; height: 18px; border-radius: 50%; padding: 0;
    border: 2px solid rgba(42,32,22,0.25); cursor: pointer; flex-shrink: 0;
  }
  .chat-swatch:hover { border-color: rgba(42,32,22,0.55); }
  .chat-swatch.selected {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--parchment), 0 0 0 3px var(--ink);
  }
  .chat-input-row input { flex: 1; }
  .chat-input-row .btn { flex-shrink: 0; }

  .list-scroll { max-height: 650px; overflow-y: auto; }

  .status-pill { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px; margin-top: 6px; }
  .status-pill.on { background: rgba(75,90,58,0.15); color: var(--moss); }
  .status-pill.off { background: rgba(140,59,42,0.12); color: var(--ember); }

  .row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .app-shell {
    display: grid;
    grid-template-columns: 170px 1fr 170px;
    gap: 24px;
    align-items: start;
  }
  .sidebar-nav {
    width: 170px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
  }
  .sidebar-nav-item {
    display: block;
    width: 100%;
    padding: 22px 10px;
    text-align: center;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--ink);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ember);
    cursor: pointer;
  }
  .sidebar-nav-item:last-child { border-bottom: none; }
  .sidebar-nav-item:hover { background: rgba(42,32,22,0.06); }
  .sidebar-nav-item.active { background: var(--ember); color: var(--parchment); }
  .main-content { max-width: 760px; margin: 0 auto; width: 100%; }
  @media (max-width: 1000px) {
    .app-shell { display: flex; gap: 24px; align-items: flex-start; }
    .sidebar-nav { flex-shrink: 0; }
    .main-content { max-width: none; margin: 0; }
  }
  @media (max-width: 760px) {
    .app-shell { flex-direction: column; }
    .sidebar-nav { width: 100%; }
  }

  .badges-row { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }

  .links-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
    padding: 8px 0 4px;
  }
  .links-bar-item {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
  }
  .links-bar-item:hover { color: var(--ember); text-decoration: underline; }
  .links-bar-sep { color: var(--bronze); opacity: 0.6; font-size: 11px; }
  .links-bar-label { color: var(--ember); font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }

  .legal-footer {
    font-style: italic;
    font-size: 10px;
    color: var(--ink-soft);
    opacity: 0.75;
    text-align: center;
    max-width: 520px;
    margin: 6px auto 18px;
    line-height: 1.5;
  }

  .killed-by { color: #D32F2F; font-weight: 700; }

  .ding-glow {
    color: #1B8A3D;
    font-weight: 800;
    text-shadow: 0 0 6px rgba(46,204,113,0.85), 0 0 14px rgba(46,204,113,0.55), 0 0 24px rgba(120,255,150,0.4);
  }

  .ssf-tag {
    display: inline-block;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #5A4B38;
    background: rgba(90,75,56,0.12);
    border: 1px solid rgba(90,75,56,0.35);
    border-radius: 3px;
    padding: 1px 5px;
    vertical-align: middle;
  }

  .eql-path-icon { cursor: help; display: inline-block; }

  .status-tag {
    display: inline-block;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.08em;
    border-radius: 3px;
    padding: 1px 6px;
    vertical-align: middle;
  }
  .status-alive {
    color: #1B8A3D;
    background: rgba(27,138,61,0.12);
    border: 1px solid rgba(27,138,61,0.4);
  }
  .status-dead {
    color: #B91C1C;
    background: rgba(185,28,28,0.12);
    border: 1px solid rgba(185,28,28,0.4);
  }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="emoji.js"></script>
<script src="renderer.js"></script>
</body>
</html>
