<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }
  #stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-top: 16px;
  }
  .toast {
    width: 360px;
    background: linear-gradient(180deg, #F6ECD3 0%, #ECDCB4 100%);
    border: 1px solid #A8823D;
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.5) inset;
    padding: 14px 18px;
    color: #2A2016;
    opacity: 0;
    transform: translateY(-16px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.hide { opacity: 0; transform: translateY(-10px); }
  .toast .title {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #8C3B2A;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .toast .body {
    font-size: 14px;
    margin: 0;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div id="stack"></div>
  <script src="notify.js"></script>
</body>
</html>
